[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openclaw-cli-auto"
version = "0.1.0"
description = "Agentic task orchestrator scaffold for autonomous CLI session pipelines"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
openclaw = "openclaw_cli_auto.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
